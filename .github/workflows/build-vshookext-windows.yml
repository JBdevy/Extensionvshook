name: Build VSHookExt Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source and SDK
        shell: bash
        run: |
          test -f CMakeLists.txt
          test -f src/vshook_extension.cpp
          test -f src/js_api_compat.cpp
          test -f sdk/reaper_plugin.h
          test -f sdk/reaper_plugin_functions.h
          CMAKE_SIZE="$(wc -c < CMakeLists.txt)"
          test "$CMAKE_SIZE" -lt 1048576 || {
            echo "::error::CMakeLists.txt passou de 1 MB e esta corrompido."
            exit 1
          }
          echo "VSHookExt sources found."

      - name: Cache FFmpeg source archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vshook-ffmpeg/ffmpeg-8.1.2.tar.xz
          key: windows-ffmpeg-8.1.2-464beb5e7bf0c311-v1

      - name: Prepare FFmpeg headers
        shell: pwsh
        run: ./.github/scripts/prepare-ffmpeg-headers.ps1 -Destination "$env:RUNNER_TEMP/vshook-ffmpeg"

      - name: Configure Windows x64
        shell: pwsh
        run: cmake -S . -B build-ci-windows -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build-ci-windows --config Release

      - name: Locate and verify DLL
        id: binary
        shell: pwsh
        run: |
          $binary = Get-ChildItem build-ci-windows -Recurse -File -Filter reaper_VSHookExt.dll | Select-Object -First 1
          if (-not $binary) { throw "reaper_VSHookExt.dll nao foi encontrada." }
          "path=$($binary.FullName)" >> $env:GITHUB_OUTPUT
          Get-Item $binary.FullName | Format-List FullName,Length,LastWriteTime

      - name: Upload Windows DLL
        uses: actions/upload-artifact@v4
        with:
          name: VSHookExt-Windows-${{ github.ref_name }}
          if-no-files-found: error
          path: ${{ steps.binary.outputs.path }}
