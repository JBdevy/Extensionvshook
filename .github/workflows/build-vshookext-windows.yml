name: Build VSHookExt Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source and SDK
        shell: bash
        run: |
          test -f CMakeLists.txt
          test -f src/vshook_extension.cpp
          test -f src/js_api_compat.cpp
          test -f sdk/reaper_plugin.h
          test -f sdk/reaper_plugin_functions.h
          echo "VSHookExt sources found."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: teleprompt-settings/package-lock.json

      - name: Install Teleprompt Settings dependencies
        shell: pwsh
        run: npm ci --prefix teleprompt-settings

      - name: Configure Windows x64
        shell: pwsh
        run: cmake -S . -B build-ci-windows -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build-ci-windows --config Release

      - name: Locate and verify DLL
        id: binary
        shell: pwsh
        run: |
          $binary = Get-ChildItem build-ci-windows -Recurse -File -Filter reaper_VSHookExt.dll | Select-Object -First 1
          if (-not $binary) { throw "reaper_VSHookExt.dll nao foi encontrada." }
          "path=$($binary.FullName)" >> $env:GITHUB_OUTPUT
          Get-Item $binary.FullName | Format-List FullName,Length,LastWriteTime

      - name: Build Teleprompt Settings Windows app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win --prefix teleprompt-settings

      - name: Assemble Windows installation package
        shell: pwsh
        run: |
          $settings = Get-ChildItem teleprompt-settings/dist -Directory -Filter win-unpacked | Select-Object -First 1
          if (-not $settings) { throw "Aplicativo de configuracoes do Teleprompt nao encontrado." }
          $package = 'build-ci-package/VSHookExt-Windows'
          New-Item -ItemType Directory -Force -Path "$package/VSHookTelepromptSettings" | Out-Null
          Copy-Item '${{ steps.binary.outputs.path }}' "$package/reaper_VSHookExt.dll" -Force
          Copy-Item "$($settings.FullName)/*" "$package/VSHookTelepromptSettings" -Recurse -Force
          if (-not (Test-Path "$package/reaper_VSHookExt.dll")) { throw "DLL ausente no pacote." }
          if (-not (Test-Path "$package/VSHookTelepromptSettings/VS Hook Teleprompt Settings.exe")) {
            throw "Executavel de configuracoes ausente no pacote."
          }
          Compress-Archive -Path $package -DestinationPath "build-ci-package/VSHookExt-Windows-${{ github.ref_name }}.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: VSHookExt-Windows-${{ github.ref_name }}
          if-no-files-found: error
          path: build-ci-package/VSHookExt-Windows-${{ github.ref_name }}.zip
